# PingMe 签到（Egern 模块）
# 写法：直接引用 fmz200/wool_scripts 原版脚本，Egern 原生可跑，无需改写。
# 2026-10-04 用户侧实测可用（对照其 Egern v9 配置中的写法）。
# 注意：同一 PingMe 账号只留一个工具跑签到，避免多个任务抢每日 5 次视频额度。
name: PingMe签到
description: PingMe 每日签到 + 5 次视频奖励。直接引用 fmz200 原版脚本（Egern 原生可跑）。每天 8:00 / 14:00 / 20:00 运行。首次使用需先抓参：保持模块启用，进 PingMe App 触发一次余额查询即自动抓取。
author: fmz200（原版脚本）
scriptings:
- http_request:
    name: PingMe 获取签到参数
    match: ^https:\/\/api\.pingmeapp\.net\/app\/queryBalanceAndBonus
    script_url: https://raw.githubusercontent.com/fmz200/wool_scripts/main/Scripts/cookie/get_cookie.js
    timeout: 60
    body_required: false
    binary_body: false
- schedule:
    name: PingMe签到
    cron: 0 8,14,20 * * *
    script_url: https://raw.githubusercontent.com/fmz200/wool_scripts/main/Scripts/PingMe/PingMeSignin.js
    timeout: 300
mitm:
  hostnames:
    includes:
    - api.pingmeapp.net
