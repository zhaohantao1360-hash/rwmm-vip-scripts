name: PingMe签到·新版
description: PingMe 每日签到 + 视频奖励（fmz200 原版逻辑 + 本地优化）。全程使用真实设备 ID；重试仅用于余额查询；今日已签过自动跳过签到接口；通知显示本次收益。定时与之前 Surge 版本保持一致：每天 08:30、20:30 各运行一次。注意：请先停用旧版 PingMe 模块，避免两个任务抢同一份额度。
compat_arguments:
  arg3: '30 8,20 * * *'
  PROXY: DIRECT
compat_arguments_schema:
  arg3:
    name: PM定时
    default_value: '30 8,20 * * *'
  PROXY:
    name: 代理策略
    description: api.pingmeapp.net 走哪个策略。默认 DIRECT（直连，实测稳定）；如需代理，可改为 Egern 配置中已有的策略组名称
    default_value: DIRECT
env:
  PINGME_CAPTURE: 'true'
env_schema:
  PINGME_CAPTURE:
    name: 抓参开关
    description: 打开后进 PingMe App 触发一次余额查询即自动抓取签到参数，抓到后建议关闭（false）
    default_value: 'true'
    options:
    - 'true'
    - 'false'
author: muse（基于 fmz200/wool_scripts 原版逻辑优化）
icon: https://raw.githubusercontent.com/axhani/icon/refs/heads/main/pingme&wetalk.png
dns: {}
rules:
- domain:
    match: api.pingmeapp.net
    policy: PROXY
scriptings:
- schedule:
    name: PingMe签到
    cron: '{{{arg3}}}'
    script_url: https://raw.githubusercontent.com/zhaohantao1360-hash/rwmm-vip-scripts/refs/heads/main/PingMeSignin_egern.js
    timeout: 300
    update_interval: 3600
- http_request:
    name: PingMe获取签到参数
    match: ^https:\/\/api\.pingmeapp\.net\/app\/queryBalanceAndBonus
    script_url: https://raw.githubusercontent.com/zhaohantao1360-hash/rwmm-vip-scripts/refs/heads/main/pingme_capture_egern.js
    timeout: 60
    update_interval: 3600
mitm:
  hostnames:
    includes:
    - api.pingmeapp.net
